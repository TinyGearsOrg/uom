version: 2
updates:
  - package-ecosystem: maven
    # scripts/consumer is a separate project that pins its own plugin versions
    directories: ["/", "/scripts/consumer"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ["*"]
    # Pinned: the Eclipse formatter jars of uom-codegen follow the Spotless Eclipse step's lockfile (uom-codegen/pom.xml)
    ignore:
      - dependency-name: "org.eclipse.jdt:*"
      - dependency-name: "org.eclipse.platform:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
