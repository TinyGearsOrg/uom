# SPDX-License-Identifier: Apache-2.0
# Build and checks only: nothing is deployed, signed or tagged (docs/RELEASING.md); scripts/check-workflows.sh guards this.
# The run commands equal the CI block of CONTRIBUTING.md.
name: CI

# pushes to main; other branches run through their pull request, once
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a superseded pull-request run is cancelled; every commit on main gets a complete run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify

  generated:
    name: generated files up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B -Pgenerate -pl uom-codegen -am process-classes
      - run: mvn -B spotless:apply
      # untracked files count as drift too
      - run: git diff --exit-code && test -z "$(git status --porcelain)"

  analyze:
    name: analyze (prek hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Spotless, the regeneration and check-pom.sh run Maven
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # the hooks of .pre-commit-config.yaml on all files (CONTRIBUTING.md, "Pre-commit hooks")
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: 0.5.5
      # a javadoc warning would otherwise surface only in the release build
      - run: bash scripts/check-javadoc.sh
